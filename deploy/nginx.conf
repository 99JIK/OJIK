# /etc/nginx/sites-available/ojik 로 복사하고 sites-enabled 에 링크한다.
#
#   sudo ln -s /etc/nginx/sites-available/ojik /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS 는 certbot 이 이 파일을 고쳐서 넣는다:
#   sudo certbot --nginx -d oj.example.com

server {
    listen 80;
    server_name oj.example.com;

    # 웹은 adapter-static 으로 뽑은 정적 파일이다. npm run build 의 결과를 여기로 올린다
    root /srv/ojik/web;
    index index.html;

    # 업로드와 제출 소스. MAX_SOURCE_BYTES 가 256KB 이고 SVG 업로드가 있다.
    # 기본값 1m 이면 큰 테스트케이스 파일 업로드에서 413 이 난다
    client_max_body_size 16m;

    # 제출 응답은 작지만 채점 현황 폴링이 잦다. 압축이 효과를 본다
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # HOST=127.0.0.1 로 묶은 api 로 넘긴다.
        # api 가 0.0.0.0 에 열려 있으면 이 프록시를 건너뛴 직접 접속이 가능해진다
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 이게 없으면 api 가 평문으로 알고 Secure 쿠키 판단이 어긋날 수 있다
        proxy_set_header X-Forwarded-Proto $scheme;

        # 채점은 오래 걸린다. 기본 60s 면 긴 제출 조회가 끊긴다
        proxy_read_timeout 120s;
    }

    # SPA 폴백.
    #
    # adapter-static 이 fallback: "index.html" 로 뽑는다. 이게 없으면 /problem/12 를
    # 주소창에 직접 치거나 새로고침했을 때 404 가 난다. 링크를 타고 들어간 사람만
    # 되는 상태라 알아채기까지 오래 걸린다
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 박힌 빌드 산출물은 오래 캐시해도 된다. index.html 은 안 된다
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
