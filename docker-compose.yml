# 개발용 인프라. Postgres 하나뿐이다.
#
# KOJ 는 여기에 RabbitMQ 가 더 있었다. 큐를 제출 테이블로 옮기면서 없앴다.
# 컨테이너 하나, 설정 파일 하나, 장애 지점 하나가 줄었고
# "큐 메시지가 재시작에 날아간다" 같은 문제가 아예 생기지 않는다.

services:
    db:
        image: postgres:17-alpine
        container_name: ojik-db
        environment:
            POSTGRES_USER: oj
            POSTGRES_PASSWORD: oj
            POSTGRES_DB: oj
            # 한국어 정렬과 대소문자 처리를 예측 가능하게 고정한다
            POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
            # 호스트 포트를 5432 가 아닌 값으로 둔다. 개발 PC 에 PostgreSQL 이 이미 깔려 있으면
            # 5432 를 그쪽이 잡고 있어서, 도커가 포트 바인딩에 성공해도 localhost 연결이
            # 네이티브 쪽으로 가 버린다. 증상은 "없는 사용자"라 password 인증 실패(28P01)
            - "${POSTGRES_PORT:-55432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U oj -d oj"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    pgdata:
