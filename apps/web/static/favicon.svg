<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    온라인 저지에서 제일 자주 보는 것이 "맞았습니다" 라 체크 하나로 둔다.
    16px 로 줄여도 알아볼 수 있는 몇 안 되는 모양이다. 글자를 넣으면 그 크기에서 뭉개진다.
    다크 모드에서는 배경을 한 톤 밝게 해서 어두운 탭 막대에 묻히지 않게 한다.
  -->
  <style>
    .bg { fill: #2563eb }
    @media (prefers-color-scheme: dark) { .bg { fill: #3b82f6 } }
  </style>
  <rect class="bg" width="32" height="32" rx="9"/>
  <path d="M9.5 16.8 L13.8 21.2 L22.8 10.6"
        fill="none" stroke="#fff" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
